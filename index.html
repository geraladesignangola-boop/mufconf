  <script>
    // Tema claro/escuro — executa antes do primeiro paint para evitar flash.
    // Preferência guardada (localStorage) e, na ausência, a do sistema operativo.
    (function () {
      try {
        var guardado = localStorage.getItem('wex-theme');
        var escuro = guardado
          ? guardado === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', escuro);
      } catch (e) {
        /* sem localStorage: mantém o tema claro por omissão */
      }
    })();
  </script>
